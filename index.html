<!-- <!doctype html> -->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="output.css" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
      rel="stylesheet"
    />
    <!-- icon -->
    <link rel="icon" href="./images/icons/icon-192x192.png" />
    <!-- manifest -->
    <link rel="manifest" href="./manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Monoton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-900 h-full w-full">
    <div class="flex flex-col h-screen justify-center items-center">
      <div
        class="flex text-9xl text-white my-10 bg-slate-800 px-20 rounded-full py-6"
        id="countStr"
      >
        0
      </div>
      <!-- +,- -->
      <div class="flex flex-row">
        <button
          class="bg-red-900/50 hover:bg-red-500 text-white font-bold py-8 px-20 rounded-r-none rounded-full text-5xl"
          id="subBtn"
          onclick="subtrack()"
        >
          -
        </button>
        <button
          class="bg-slate-600 hover:bg-blue-700 text-white font-bold py-8 px-20 rounded-l-none rounded-full text-5xl"
          id="addBtn"
          onclick="addition()"
        >
          +
        </button>
      </div>
      <!-- save,reset -->
    </div>
    <button
      class="w-auto border-2 border-red-600 hover:bg-red-500 text-white px-6 py-3 rounded-full text-lg absolute top-3 right-3"
      onclick="resetbtn()"
    >
      Reset
    </button>
    <script src="./script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js");
      }
    </script>
  </body>
</html>
