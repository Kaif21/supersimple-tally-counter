<!-- <!doctype html> -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="output.css">
  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
<!-- icon -->
<link rel="icon" href="./images/icons/icon-192x192.png">
<!-- manifest -->
<link rel="manifest" href="./manifest.json">
</head>
<body class="bg-slate-950">
    <div class="flex flex-col min-h-screen justify-center items-center">
<div class="flex text-9xl text-white my-10" id="countStr">0</div>
<!-- +,- -->
<div class="flex flex-row gap-10">
    <button class="bg-red-600 hover:bg-red-800 text-white font-bold py-2 px-4 rounded-full text-2xl" id="subBtn" onclick="subtrack()">
        -
    </button>
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full text-2xl" id="addBtn" onclick="addition()">
        +
    </button>
</div>
<!-- save,reset -->
<div class="flex  gap-10 my-10">
    <button class="bg-red-600 hover:bg-red-800 text-white font-bold px-5 rounded-full text-lg" onclick="resetbtn()">
        Reset
    </button>
    
</div>
</div>
<script src="./script.js"></script>
<script>
    if ('serviceWorker' in navigator){
        navigator.serviceWorker.register('/service-worker.js')
    }
</script>
</body>
</html>
